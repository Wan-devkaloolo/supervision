<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE192" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#9C7723" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9A24B" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Crown & Sovereign Emblem -->
  <g filter="url(#glow)">
    <!-- Crown Base -->
    <path d="M160 330 L352 330 L342 355 L170 355 Z" fill="url(#goldGrad)" />
    
    <!-- Crown Peaks -->
    <path d="M150 310 L160 210 L215 270 L256 160 L297 270 L352 210 L362 310 Z" fill="url(#goldGrad)" />
    
    <!-- Crown Jewels / Dots -->
    <circle cx="160" cy="195" r="12" fill="url(#goldGrad)" />
    <circle cx="256" cy="140" r="16" fill="url(#goldGrad)" />
    <circle cx="352" cy="195" r="12" fill="url(#goldGrad)" />

    <!-- Site Ops Compass / Check Accent -->
    <circle cx="256" cy="275" r="22" fill="#0B1F3A" stroke="url(#goldGrad)" stroke-width="4" />
    <path d="M246 275 L253 282 L266 268" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Subtle text at bottom -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="6" fill="#C9A24B" text-anchor="middle">SOVEREIGN</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#8E9EB8" text-anchor="middle">SITE OPS</text>
</svg>
